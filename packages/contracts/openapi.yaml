openapi: 3.1.0
info:
  title: OpenLibrary API
  version: 0.2.0
  description: |
    Contract between the server and the Android app (F2: browsing and sync pull; F3: push).
    The web app uses the TypeScript contracts in `src/` directly; this file covers what Android consumes
    and is checked against real server responses by `apps/server/test/openapi.test.ts`.

    Errors are RFC 9457 problems (`application/problem+json`) with a stable `code`; `detail` is
    translated according to `Accept-Language` (en, es).
servers:
  - url: https://openlibrary.example.ts.net/api/v1
security:
  - deviceToken: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server status and data epoch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /auth/devices:
    post:
      operationId: registerDevice
      security: []
      description: Registers this device with the owner's password. The token is shown only once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegisterRequest' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegisterResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: getSession
      responses:
        '200':
          description: The current session (fails with 401 once the device is revoked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Problem' }
  /sync/snapshot:
    get:
      operationId: getSnapshot
      description: Every live entity plus the cursor to continue pulling from. Used on first connection and after a resync.
      responses:
        '200':
          description: Full snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSnapshot' }
        '401': { $ref: '#/components/responses/Problem' }
  /sync/pull:
    get:
      operationId: pull
      description: |
        Current state of every entity changed after `since`, once each, plus tombstones.
        Apply a page in one transaction (records are not in dependency order) and keep pulling while `hasMore`.
        409 `epoch-mismatch` or `cursor-ahead` means the local copy must be replaced by a new snapshot.
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: epoch, in: query, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 500 },
          }
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sync/push:
    post:
      operationId: push
      description: |
        Offline operations, applied in order, each in its own transaction. Resending an op (same `opId`)
        returns `duplicate` and changes nothing. A `conflict` applies nothing of that op; resolve it with a
        new op based on `currentVersion`. 409 `epoch-mismatch` refuses the whole batch (take a snapshot first).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: One result per op, in the same order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /lookup/isbn/{isbn}:
    get:
      operationId: lookupIsbn
      description: |
        Metadata proposal from external providers (proxied and cached by the server) and, if you already own
        that edition, `existing`. Providers that failed are listed in `errors`; adding the book by hand still works.
      parameters:
        - { name: isbn, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Proposal (or `found` false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /lookup/search:
    get:
      operationId: searchMetadata
      description: |
        Candidates found by the title/author text read on a cover photo. The user chooses one; nothing is
        stored. Providers that failed are listed in `errors` and partial results are still returned.
        Open Library candidates never carry an ISBN (search results are work-level); Google Books
        candidates carry the ISBN of that exact volume.
      parameters:
        - { name: title, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: author, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Candidates, best match first (at most 8).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataSearchResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /assets:
    post:
      operationId: uploadAsset
      description: |
        Uploads a cover photo (JPEG/PNG/WebP, max 15 MB). The id is the SHA-256 of the uploaded bytes, so a
        device can reference it in ops before uploading; upload it before pushing those ops. Idempotent.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /assets/fetch:
    post:
      operationId: fetchAsset
      description: Stores the cover proposed by a provider (`proposal.coverUrl`) on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '502': { $ref: '#/components/responses/Problem' }
  /stats:
    get:
      operationId: getStats
      description: |
        Collection, reading, acquisitions, rankings and wishlist figures (definitions in
        packages/contracts/src/stats.ts). Android computes the same on its local copy; fixtures/stats.json
        is the server's result for fixtures/snapshot.json, so both are checked against each other.
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Problem' }
  /assets/{id}:
    get:
      operationId: getAsset
      description: A cover as JPEG. `thumb` is 400 px wide; cache it forever (content addressed).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - {
            name: size,
            in: query,
            required: false,
            schema: { type: string, enum: [thumb, full], default: thumb },
          }
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        retryAfterSeconds: { type: integer }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, epoch, time]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        epoch: { type: string, description: Changes when a backup is restored. }
        time: { type: string }
    DeviceRegisterRequest:
      type: object
      required: [password, name]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [android, web, other], default: android }
    DeviceRegisterResponse:
      type: object
      additionalProperties: false
      required: [deviceId, token]
      properties:
        deviceId: { type: string }
        token: { type: string }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [authenticated, kind, sessionId, expiresAt]
      properties:
        authenticated: { type: boolean, const: true }
        kind: { type: string, enum: [web, device] }
        sessionId: { type: string }
        expiresAt: { type: [string, 'null'] }
    SyncWork:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          createdAt,
          updatedAt,
          title,
          subtitle,
          authors,
          subjects,
          description,
          originalTitle,
          originalLanguage,
          series,
          seriesIndex,
        ]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { type: string } }
        subjects: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        originalTitle: { type: [string, 'null'] }
        originalLanguage: { type: [string, 'null'] }
        series: { type: [string, 'null'] }
        seriesIndex: { type: [number, 'null'] }
    SyncEdition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          createdAt,
          updatedAt,
          workId,
          title,
          subtitle,
          publisher,
          publishedYear,
          language,
          pages,
          format,
          isbn13,
          coverAssetId,
          metadataStatus,
          metadataSource,
        ]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        workId: { type: string }
        title: { type: [string, 'null'], description: Only when it differs from the work's title. }
        subtitle: { type: [string, 'null'] }
        publisher: { type: [string, 'null'] }
        publishedYear: { type: [integer, 'null'] }
        language: { type: [string, 'null'] }
        pages: { type: [integer, 'null'] }
        format: { type: [string, 'null'] }
        isbn13: { type: [string, 'null'] }
        coverAssetId: { type: [string, 'null'], description: 'Download with GET /assets/{id}.' }
        metadataStatus: { type: string, enum: [complete, provisional] }
        metadataSource: { type: [string, 'null'] }
    SyncCopy:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          createdAt,
          updatedAt,
          editionId,
          code,
          locationId,
          condition,
          acquiredOn,
          priceCents,
          priceCurrency,
          notes,
          status,
          retiredReason,
          retiredOn,
        ]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        editionId: { type: string }
        code: { type: string, description: Human-friendly code such as EJ-0001. }
        locationId: { type: [string, 'null'] }
        condition: { type: string, enum: [new, fine, good, used, fair, poor] }
        acquiredOn: { type: [string, 'null'], description: YYYY-MM-DD }
        priceCents: { type: [integer, 'null'] }
        priceCurrency: { type: string }
        notes: { type: string }
        status: { type: string, enum: [active, retired] }
        retiredReason: { type: [string, 'null'], enum: [gifted, sold, lost, damaged, other, null] }
        retiredOn: { type: [string, 'null'] }
    SyncLocation:
      type: object
      additionalProperties: false
      required: [id, version, createdAt, updatedAt, parentId, name, kind, sortOrder]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        parentId: { type: [string, 'null'] }
        name: { type: string }
        kind: { type: string, enum: [home, room, bookcase, shelf, box, other] }
        sortOrder: { type: integer }
    SyncReading:
      type: object
      additionalProperties: false
      required: [id, version, createdAt, updatedAt, copyId, status, startedOn, finishedOn, rating, notes]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        copyId: { type: string }
        status: { type: string, enum: [pending, reading, read, abandoned] }
        startedOn: { type: [string, 'null'], description: YYYY-MM-DD }
        finishedOn: { type: [string, 'null'], description: YYYY-MM-DD }
        rating: { type: [number, 'null'], description: 0.5 to 5 in half points }
        notes: { type: string }
    SyncWish:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          createdAt,
          updatedAt,
          title,
          authors,
          isbn13,
          workId,
          priority,
          notes,
          status,
          acquiredCopyId,
          coverAssetId,
        ]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        title: { type: string }
        authors: { type: array, items: { type: string } }
        isbn13: { type: [string, 'null'] }
        workId: { type: [string, 'null'] }
        priority: { type: string, enum: [low, normal, high] }
        notes: { type: string }
        status: { type: string, enum: [open, acquired, discarded] }
        acquiredCopyId: { type: [string, 'null'], description: The copy created by "I bought it". }
        coverAssetId:
          type: [string, 'null']
          description: Cover found by the ISBN lookup; "I bought it" gives it to the new edition.
    SyncQuote:
      type: object
      additionalProperties: false
      required: [id, version, createdAt, updatedAt, workId, copyId, text, page, note]
      properties:
        id: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        workId: { type: string }
        copyId: { type: [string, 'null'] }
        text: { type: string }
        page: { type: [integer, 'null'] }
        note: { type: string }
    SyncTombstone:
      type: object
      additionalProperties: false
      required: [entity, id, version, deletedAt]
      properties:
        entity: { type: string, enum: [work, edition, copy, location, reading, wish, quote] }
        id: { type: string }
        version: { type: integer }
        deletedAt: { type: string }
    SyncSnapshot:
      type: object
      additionalProperties: false
      required: [epoch, cursor, serverTime, works, editions, copies, locations, readings, wishes, quotes]
      properties:
        epoch: { type: string }
        cursor: { type: integer, description: Pass it as `since` in the next pull. }
        serverTime: { type: string }
        works: { type: array, items: { $ref: '#/components/schemas/SyncWork' } }
        editions: { type: array, items: { $ref: '#/components/schemas/SyncEdition' } }
        copies: { type: array, items: { $ref: '#/components/schemas/SyncCopy' } }
        locations: { type: array, items: { $ref: '#/components/schemas/SyncLocation' } }
        readings: { type: array, items: { $ref: '#/components/schemas/SyncReading' } }
        wishes: { type: array, items: { $ref: '#/components/schemas/SyncWish' } }
        quotes: { type: array, items: { $ref: '#/components/schemas/SyncQuote' } }
    SyncPullPage:
      type: object
      additionalProperties: false
      required:
        [
          epoch,
          cursor,
          hasMore,
          serverTime,
          works,
          editions,
          copies,
          locations,
          readings,
          wishes,
          quotes,
          deleted,
        ]
      properties:
        epoch: { type: string }
        cursor: { type: integer }
        hasMore: { type: boolean }
        serverTime: { type: string }
        works: { type: array, items: { $ref: '#/components/schemas/SyncWork' } }
        editions: { type: array, items: { $ref: '#/components/schemas/SyncEdition' } }
        copies: { type: array, items: { $ref: '#/components/schemas/SyncCopy' } }
        locations: { type: array, items: { $ref: '#/components/schemas/SyncLocation' } }
        readings: { type: array, items: { $ref: '#/components/schemas/SyncReading' } }
        wishes: { type: array, items: { $ref: '#/components/schemas/SyncWish' } }
        quotes: { type: array, items: { $ref: '#/components/schemas/SyncQuote' } }
        deleted: { type: array, items: { $ref: '#/components/schemas/SyncTombstone' } }
    SyncPushRequest:
      type: object
      required: [epoch, ops]
      properties:
        epoch: { type: string }
        ops:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            Each op has `opId` (UUIDv7) and `type`, plus:
            `book.create` → `book` (as POST /books: `work` or `workId`, `edition`, `copy`, all with client ids);
            `copy.create` → `copy` (as POST /copies); `location.create` → `location` (as POST /locations);
            `reading.create` → `reading` (as POST /reading-sessions: `copyId`, `status`, dates, rating, notes);
            `wish.create` → `wish` (as POST /wishlist: `title`, `authors`, `isbn13`, `priority`, `notes`…);
            `quote.create` → `quote` (as POST /quotes: `workId`, `text`, `page`, `note`, `copyId`); `quote.delete` → `id`;
            `work.update` | `edition.update` | `copy.update` | `location.update` | `reading.update` |
            `wish.update` | `quote.update` → `id` and
            `patch` ({ baseVersion, fields }, only the fields the user changed).
          items:
            type: object
            required: [opId, type]
            properties:
              opId: { type: string }
              type:
                type: string
                enum:
                  [
                    book.create,
                    copy.create,
                    location.create,
                    reading.create,
                    wish.create,
                    quote.create,
                    quote.delete,
                    work.update,
                    edition.update,
                    copy.update,
                    location.update,
                    reading.update,
                    wish.update,
                    quote.update,
                  ]
    SyncOpResult:
      type: object
      additionalProperties: false
      required: [opId, status]
      properties:
        opId: { type: string }
        status: { type: string, enum: [applied, duplicate, conflict, rejected] }
        code:
          {
            type: string,
            description: 'Why it was not applied: conflict, validation, bad-request, duplicate-isbn…',
          }
        message: { type: string, description: Translated according to Accept-Language. }
        currentVersion: { type: integer, description: Server version of the entity (conflicts). }
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, current, yours]
            properties:
              field: { type: string }
              current: { description: Value on the server. }
              yours: { description: Value sent by this device. }
    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [epoch, results, serverTime]
      properties:
        epoch: { type: string }
        serverTime: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/SyncOpResult' } }
    MetadataProposal:
      type: object
      additionalProperties: false
      required:
        [title, subtitle, authors, publisher, publishedYear, language, pages, subjects, description, coverUrl]
      properties:
        title: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { type: string } }
        publisher: { type: [string, 'null'] }
        publishedYear: { type: [integer, 'null'] }
        language: { type: [string, 'null'] }
        pages: { type: [integer, 'null'] }
        subjects: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
    LookupResult:
      type: object
      additionalProperties: false
      required: [isbn13, isbn10, found, sources, proposal, existing, errors]
      properties:
        isbn13: { type: string }
        isbn10: { type: [string, 'null'] }
        found: { type: boolean }
        sources: { type: array, items: { type: string } }
        proposal:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/MetadataProposal' }
        existing:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [editionId, workId, title, copies]
              properties:
                editionId: { type: string }
                workId: { type: string }
                title: { type: string }
                copies: { type: integer }
        errors: { type: array, items: { type: string } }
    MetadataCandidate:
      type: object
      additionalProperties: false
      required:
        [title, subtitle, authors, publisher, publishedYear, language, isbn13, coverUrl, sources, owned]
      properties:
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { type: string } }
        publisher: { type: [string, 'null'] }
        publishedYear: { type: [integer, 'null'] }
        language: { type: [string, 'null'] }
        isbn13:
          {
            type: [string, 'null'],
            description: Only when it is the ISBN of that exact volume (Google Books).,
          }
        coverUrl: { type: [string, 'null'] }
        sources: { type: array, items: { type: string } }
        owned: { type: boolean, description: An edition with this ISBN is already in the catalog. }
    MetadataSearchResult:
      type: object
      additionalProperties: false
      required: [query, candidates, sources, errors]
      properties:
        query:
          type: object
          additionalProperties: false
          required: [title, author]
          properties:
            title: { type: [string, 'null'] }
            author: { type: [string, 'null'] }
        candidates: { type: array, items: { $ref: '#/components/schemas/MetadataCandidate' } }
        sources: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
    Asset:
      type: object
      additionalProperties: false
      required: [id, mime, width, height, bytes]
      properties:
        id: { type: string, description: SHA-256 of the uploaded bytes. }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
    CountBy:
      type: object
      additionalProperties: false
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    Stats:
      type: object
      additionalProperties: false
      required: [collection, reading, acquiredByYear, authors, subjects, languages, wishlistOpen]
      properties:
        collection:
          type: object
          additionalProperties: false
          required:
            [
              works,
              editions,
              copies,
              retiredCopies,
              copiesWithoutLocation,
              provisionalEditions,
              locations,
              value,
            ]
          properties:
            works: { type: integer }
            editions: { type: integer }
            copies: { type: integer }
            retiredCopies: { type: integer }
            copiesWithoutLocation: { type: integer }
            provisionalEditions: { type: integer }
            locations: { type: integer }
            value:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [currency, cents]
                properties:
                  currency: { type: string }
                  cents: { type: integer }
        reading:
          type: object
          additionalProperties: false
          required: [read, reading, pending, finishedSessions, abandonedSessions, averageRating, byYear]
          properties:
            read: { type: integer }
            reading: { type: integer }
            pending: { type: integer }
            finishedSessions: { type: integer }
            abandonedSessions: { type: integer }
            averageRating: { type: [number, 'null'] }
            byYear:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [year, works, pages]
                properties:
                  year: { type: integer }
                  works: { type: integer }
                  pages: { type: integer }
        acquiredByYear:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [year, copies]
