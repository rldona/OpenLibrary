name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Shellcheck the deployment scripts
        run: shellcheck -x deploy/scripts/*.sh deploy/scripts/ol deploy/railway/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openlibrary:ci .
      - name: Start and check health + login
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name ol -p 8080:8080 -v "$PWD/data:/data" -e PUBLIC_URL=http://localhost:8080 openlibrary:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/v1/health && break; sleep 1; done
          docker exec -e OL_PASSWORD='ci test password 123' ol node dist/cli.js set-password
          curl -fs -X POST localhost:8080/api/v1/auth/login -H 'content-type: application/json' \
            -H 'origin: http://localhost:8080' -d '{"password":"ci test password 123"}' -o /dev/null
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          docker exec ol node dist/cli.js backup /data/backups/library.db
          docker exec ol node dist/cli.js check
      - name: Started as root on a root-owned volume (like Railway)
        run: |
          mkdir -p rootdata && sudo chown 0:0 rootdata
          docker run -d --name olroot --user 0 -p 3000:3000 -e PORT=3000 -v "$PWD/rootdata:/data" \
            -e PUBLIC_URL=http://localhost:3000 openlibrary:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/v1/health && break; sleep 1; done
          curl -fs localhost:3000/api/v1/health
          # `railway ssh` runs commands as root.
          docker exec -u 0 -e OL_PASSWORD='ci test password 123' olroot node dist/cli.js set-password
          docker exec -u 0 olroot node dist/cli.js backup /data/backups/library.db
          docker exec -u 0 olroot node dist/cli.js check
          test "$(docker inspect -f '{{.State.Health.Status}}' olroot)" != unhealthy
          ls -lnR rootdata
          if sudo find rootdata ! -uid 1000 | grep .; then echo "files not owned by uid 1000"; exit 1; fi

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (contract fixtures, sync, logic), debug and release builds
        # The release build is minified by R8 (unsigned here: the signing key never leaves the owner's PC).
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
      - name: Minified release keeps the constructors used by reflection
        run: python3 scripts/check-release-reflection.py app/build/outputs/apk/release/app-release-unsigned.apk

  # Production deploy to Railway: only pushes to main, only after the checks and the image build
  # pass, only when something that goes into the image changed. Pull requests (forks included)
  # never reach this job, so they never see the token.
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: https://app-production-10a9154b.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did anything that goes into the image change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -qE '^(apps/server/|apps/web/|packages/|Dockerfile$|\.dockerignore$|\.railwayignore$|package(-lock)?\.json$|tsconfig\.base\.json$)' <<<"$files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in the image changed (Android, docs, CI, .railway/…): no deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Railway CLI
        if: steps.changes.outputs.deploy == 'true'
        run: npm install -g @railway/cli@5.71.0
      - name: Deploy
        if: steps.changes.outputs.deploy == 'true'
        run: |
          version=${GITHUB_SHA::12}
          # The commit becomes the build argument and runtime variable OL_VERSION.
          railway variable set "OL_VERSION=$version" --service app --skip-deploys --json > /dev/null
          railway up --ci --service app
      - name: Wait until the new version answers
        if: steps.changes.outputs.deploy == 'true'
        run: |
          version=${GITHUB_SHA::12}
          for _ in $(seq 1 60); do
            got=$(curl -fsS "$PUBLIC_URL/api/v1/health" | jq -r .version || true)
            if [ "$got" = "$version" ]; then echo "Live: $version"; exit 0; fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL still reports version '$got', expected $version"
          exit 1
