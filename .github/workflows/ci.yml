name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Shellcheck the deployment scripts
        run: shellcheck -x deploy/scripts/*.sh deploy/scripts/ol deploy/railway/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openlibrary:ci .
      - name: Start and check health + login
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name ol -p 8080:8080 -v "$PWD/data:/data" -e PUBLIC_URL=http://localhost:8080 openlibrary:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/v1/health && break; sleep 1; done
          docker exec -e OL_PASSWORD='ci test password 123' ol node dist/cli.js set-password
          curl -fs -X POST localhost:8080/api/v1/auth/login -H 'content-type: application/json' \
            -H 'origin: http://localhost:8080' -d '{"password":"ci test password 123"}' -o /dev/null
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          docker exec ol node dist/cli.js backup /data/backups/library.db
          docker exec ol node dist/cli.js check
      - name: Started as root on a root-owned volume (like Railway)
        run: |
          mkdir -p rootdata && sudo chown 0:0 rootdata
          docker run -d --name olroot --user 0 -p 3000:3000 -e PORT=3000 -v "$PWD/rootdata:/data" \
            -e PUBLIC_URL=http://localhost:3000 openlibrary:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/v1/health && break; sleep 1; done
          curl -fs localhost:3000/api/v1/health
          # `railway ssh` runs commands as root.
          docker exec -u 0 -e OL_PASSWORD='ci test password 123' olroot node dist/cli.js set-password
          docker exec -u 0 olroot node dist/cli.js backup /data/backups/library.db
          docker exec -u 0 olroot node dist/cli.js check
          test "$(docker inspect -f '{{.State.Health.Status}}' olroot)" != unhealthy
          ls -lnR rootdata
          if sudo find rootdata ! -uid 1000 | grep .; then echo "files not owned by uid 1000"; exit 1; fi

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (contract fixtures, sync, logic) and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
