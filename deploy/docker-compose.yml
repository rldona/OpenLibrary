# OpenLibrary on the Ubuntu PC.
# The app only listens on 127.0.0.1: outside access is provided by "tailscale serve" (HTTPS, your tailnet only).
name: openlibrary
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: openlibrary:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ${OL_DATA:-/srv/openlibrary/data}:/data
    ports:
      - '127.0.0.1:8080:8080'
    stop_grace_period: 20s
